name: Replication checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: make test
      - name: Re-solve headline results and check integer witnesses
        run: make verify
      - name: Build anonymous archive from committed files
        run: python paper/review_package.py "$RUNNER_TEMP/review.zip"
      - name: Verify archive and test without Git metadata
        shell: bash
        run: |
          python paper/review_package.py "$RUNNER_TEMP/review.zip" --verify
          python -m zipfile -e "$RUNNER_TEMP/review.zip" "$RUNNER_TEMP/received"
          cd "$RUNNER_TEMP/received/replication"
          make test
